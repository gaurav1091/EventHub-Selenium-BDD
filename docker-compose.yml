services:
  eventhub-tests:
    build: .
    image: eventhub-selenium-bdd:latest
    platform: linux/amd64
    shm_size: "2gb"
    env_file:
      - .env
    environment:
      BROWSER: ${BROWSER:-chrome}
      HEADLESS: ${DOCKER_HEADLESS:-true}
      EXECUTION_TARGET: ${EXECUTION_TARGET:-local}
      SELENIUM_REMOTE_URL: ${SELENIUM_REMOTE_URL:-http://selenium-hub:4444/wd/hub}
      ENVIRONMENT: ${ENVIRONMENT:-qa}
      SUITE: ${SUITE:-smoke}
      PARALLEL: ${PARALLEL:-false}
      THREAD_COUNT: ${THREAD_COUNT:-2}
      CUCUMBER_FILTER_TAGS: ${CUCUMBER_FILTER_TAGS:-}
      IMPACT_AREA: ${IMPACT_AREA:-none}
      RETRY_MAX_ALLOWED: ${RETRY_MAX_ALLOWED:-0}
      ACCESSIBILITY_THRESHOLD_ENABLED: ${ACCESSIBILITY_THRESHOLD_ENABLED:-false}
      ACCESSIBILITY_MAX_VIOLATIONS: ${ACCESSIBILITY_MAX_VIOLATIONS:-0}
      VISUAL_BASELINE_ENABLED: ${VISUAL_BASELINE_ENABLED:-false}
      VISUAL_BASELINE_UPDATE: ${VISUAL_BASELINE_UPDATE:-false}
      VISUAL_DIFF_MAX_PIXELS: ${VISUAL_DIFF_MAX_PIXELS:-0}
    volumes:
      - ./target:/eventhub/target
      - ./screenshots:/eventhub/screenshots
      - ./logs:/eventhub/logs
