name: EventHub Selenium BDD

on:
  push:
  pull_request:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      browser:
        description: Browser for UI tests
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
      suite:
        description: Test suite/tag expression to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - ui
          - api
          - regression
          - admin
          - auth
          - bookings
          - events
          - navigation
          - hybrid
          - stateful
          - parallel-safe
          - p0-smoke
          - p1-regression
          - api-contract
          - ui-critical
          - nightly-stateful
          - accessibility
          - visual
          - impact-auth
          - impact-events
          - impact-bookings
          - impact-admin
          - impact-api
          - impact-ux
          - docker-smoke
          - all
      impact-area:
        description: Optional impact area override for faster targeted CI
        required: true
        default: none
        type: choice
        options:
          - none
          - auth
          - events
          - bookings
          - admin
          - api
          - ux
          - integration
      parallel:
        description: Run scenarios in parallel
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      thread-count:
        description: Thread count used when parallel=true
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: eventhub-selenium-bdd-pages
  cancel-in-progress: false

jobs:
  impact-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: pr-impact / auto
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run impacted tests
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          TAG_EXPRESSION="$(bash scripts/select-impact-tags.sh --base "origin/${{ github.base_ref }}" --head HEAD)"
          BROWSER="chrome"
          SUITE="pr-impact"
          PARALLEL="false"
          THREAD_COUNT="1"

          MVN_ARGS=(-Dheadless=true -Dbrowser="$BROWSER" -Dsuite.name="$SUITE")

          if [[ "$TAG_EXPRESSION" == *"@impact-integration"* ]]; then
            MVN_ARGS+=(-Dparallel=none "-Dcucumber.filter.tags=$TAG_EXPRESSION")
          else
            PARALLEL="true"
            THREAD_COUNT="2"
            MVN_ARGS+=(-Dsuite.xml.file=target/test-classes/suites/testng-parallel.xml -Dparallel=methods -Dthread.count=2)
            TAG_EXPRESSION="($TAG_EXPRESSION) and not @stateful"
            MVN_ARGS+=("-Dcucumber.filter.tags=$TAG_EXPRESSION")
          fi

          {
            echo "REPORT_BROWSER=$BROWSER"
            echo "REPORT_SUITE=$SUITE"
            echo "REPORT_PARALLEL=$PARALLEL"
            echo "REPORT_THREAD_COUNT=$THREAD_COUNT"
            echo "REPORT_JOB_NAME=pr-impact"
            echo "REPORT_TAG_EXPRESSION=$TAG_EXPRESSION"
          } >> "$GITHUB_ENV"

          bash scripts/run-maven-with-infra-retry.sh mvn test "${MVN_ARGS[@]}"
          bash scripts/assert-scenarios-executed.sh
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/run-summary/github-step-summary.md ]]; then
            cat target/run-summary/github-step-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f target/run-summary/impact-selection.md ]]; then
            cat target/run-summary/impact-selection.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build Pages report bundle
        if: always()
        shell: bash
        run: bash scripts/build-pages-report.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eventhub-pr-impact-reports
          path: |
            target/cucumber-reports
            target/extent-report
            target/allure-results
            target/axe-reports
            target/visual-sanity
            target/visual-diff
            target/governance
            target/run-summary
            target/run-logs
            target/surefire-reports
            screenshots
      - name: Upload Pages report bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pages-report-pr-impact
          path: target/pages-report

  matrix-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            suite: smoke
            parallel: "false"
            thread-count: "2"
          - browser: firefox
            suite: smoke
            parallel: "false"
            thread-count: "2"
          - browser: chrome
            suite: api
            parallel: "true"
            thread-count: "2"
          - browser: chrome
            suite: parallel-safe
            parallel: "true"
            thread-count: "4"
    name: matrix / ${{ matrix.browser }} / ${{ matrix.suite }} / parallel=${{ matrix.parallel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        shell: bash
        run: |
          BROWSER="${{ matrix.browser }}"
          SUITE="${{ matrix.suite }}"
          PARALLEL="${{ matrix.parallel }}"
          THREAD_COUNT="${{ matrix['thread-count'] }}"

          case "$SUITE" in
            all) TAG_EXPRESSION="" ;;
            p0-smoke) TAG_EXPRESSION="@p0 and @smoke" ;;
            p1-regression) TAG_EXPRESSION="@p1 and @regression" ;;
            api-contract) TAG_EXPRESSION="@api and @contract" ;;
            ui-critical) TAG_EXPRESSION="@ui and @critical" ;;
            nightly-stateful) TAG_EXPRESSION="@stateful and @regression" ;;
            accessibility) TAG_EXPRESSION="@accessibility" ;;
            docker-smoke) TAG_EXPRESSION="@docker-smoke or (@p0 and @smoke)" ;;
            *) TAG_EXPRESSION="@$SUITE" ;;
          esac

          if [[ "$PARALLEL" == "true" && ("$SUITE" =~ ^(hybrid|stateful|nightly-stateful)$ || "$IMPACT_AREA" == "integration") ]]; then
            echo "::error::Selected coverage is stateful and must run with parallel=false. Parallel mode adds 'not @stateful', which would execute zero scenarios."
            exit 1
          fi

          MVN_ARGS=(-Dheadless=true -Dbrowser="$BROWSER" -Dsuite.name="$SUITE")

          if [[ "$PARALLEL" == "true" ]]; then
            if [[ -z "$TAG_EXPRESSION" ]]; then
              TAG_EXPRESSION="not @stateful"
            else
              TAG_EXPRESSION="($TAG_EXPRESSION) and not @stateful"
            fi
            MVN_ARGS+=(-Dsuite.xml.file=target/test-classes/suites/testng-parallel.xml -Dparallel=methods -Dthread.count="$THREAD_COUNT")
          else
            MVN_ARGS+=(-Dparallel=none)
          fi

          if [[ -n "$TAG_EXPRESSION" ]]; then
            MVN_ARGS+=("-Dcucumber.filter.tags=$TAG_EXPRESSION")
          fi

          {
            echo "REPORT_BROWSER=$BROWSER"
            echo "REPORT_SUITE=$SUITE"
            echo "REPORT_PARALLEL=$PARALLEL"
            echo "REPORT_THREAD_COUNT=$THREAD_COUNT"
            echo "REPORT_JOB_NAME=matrix-$BROWSER-$SUITE"
            echo "REPORT_TAG_EXPRESSION=$TAG_EXPRESSION"
          } >> "$GITHUB_ENV"

          bash scripts/run-maven-with-infra-retry.sh mvn test "${MVN_ARGS[@]}"
          bash scripts/assert-scenarios-executed.sh
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/run-summary/github-step-summary.md ]]; then
            cat target/run-summary/github-step-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f target/run-summary/impact-selection.md ]]; then
            cat target/run-summary/impact-selection.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build Pages report bundle
        if: always()
        shell: bash
        run: bash scripts/build-pages-report.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eventhub-test-reports-${{ matrix.browser }}-${{ matrix.suite }}-parallel-${{ matrix.parallel }}
          path: |
            target/cucumber-reports
            target/extent-report
            target/allure-results
            target/axe-reports
            target/visual-sanity
            target/visual-diff
            target/governance
            target/run-summary
            target/run-logs
            target/surefire-reports
            screenshots
      - name: Upload Pages report bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pages-report-matrix-${{ matrix.browser }}-${{ matrix.suite }}-parallel-${{ matrix.parallel }}-threads-${{ matrix['thread-count'] }}
          path: target/pages-report

  nightly-regression:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            suite: regression
            tag-expression: "(@regression and @parallel-safe) and not @stateful"
            parallel: "true"
            thread-count: "4"
          - browser: firefox
            suite: regression
            tag-expression: "(@regression and @parallel-safe) and not @stateful"
            parallel: "true"
            thread-count: "4"
          - browser: chrome
            suite: api-regression
            tag-expression: "@api and @regression"
            parallel: "true"
            thread-count: "3"
          - browser: chrome
            suite: stateful-regression
            tag-expression: "@stateful"
            parallel: "false"
            thread-count: "1"
    name: nightly / ${{ matrix.browser }} / ${{ matrix.suite }} / parallel=${{ matrix.parallel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run nightly regression
        shell: bash
        run: |
          {
            echo "REPORT_BROWSER=${{ matrix.browser }}"
            echo "REPORT_SUITE=${{ matrix.suite }}"
            echo "REPORT_PARALLEL=${{ matrix.parallel }}"
            echo "REPORT_THREAD_COUNT=${{ matrix['thread-count'] }}"
            echo "REPORT_JOB_NAME=nightly-${{ matrix.browser }}-${{ matrix.suite }}"
            echo "REPORT_TAG_EXPRESSION=${{ matrix['tag-expression'] }}"
          } >> "$GITHUB_ENV"

          MVN_ARGS=(-Dheadless=true -Dbrowser="${{ matrix.browser }}" -Dsuite.name="${{ matrix.suite }}" "-Dcucumber.filter.tags=${{ matrix['tag-expression'] }}")

          if [[ "${{ matrix.parallel }}" == "true" ]]; then
            MVN_ARGS+=(-Dsuite.xml.file=target/test-classes/suites/testng-parallel.xml -Dparallel=methods -Dthread.count="${{ matrix['thread-count'] }}")
          else
            MVN_ARGS+=(-Dparallel=none)
          fi

          bash scripts/run-maven-with-infra-retry.sh mvn test "${MVN_ARGS[@]}"
          bash scripts/assert-scenarios-executed.sh
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/run-summary/github-step-summary.md ]]; then
            cat target/run-summary/github-step-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f target/run-summary/impact-selection.md ]]; then
            cat target/run-summary/impact-selection.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build Pages report bundle
        if: always()
        shell: bash
        run: bash scripts/build-pages-report.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eventhub-nightly-reports-${{ matrix.browser }}-${{ matrix.suite }}-parallel-${{ matrix.parallel }}
          path: |
            target/cucumber-reports
            target/extent-report
            target/allure-results
            target/axe-reports
            target/visual-sanity
            target/visual-diff
            target/governance
            target/run-summary
            target/run-logs
            target/surefire-reports
            screenshots
      - name: Upload Pages report bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pages-report-nightly-${{ matrix.browser }}-${{ matrix.suite }}-parallel-${{ matrix.parallel }}-threads-${{ matrix['thread-count'] }}
          path: target/pages-report

  selected-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: selected / ${{ github.event.inputs.browser }} / ${{ github.event.inputs.suite }} / parallel=${{ github.event.inputs.parallel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run selected tests
        shell: bash
        run: |
          BROWSER="${{ github.event.inputs.browser }}"
          SUITE="${{ github.event.inputs.suite }}"
          IMPACT_AREA="${{ github.event.inputs['impact-area'] }}"
          PARALLEL="${{ github.event.inputs.parallel }}"
          THREAD_COUNT="${{ github.event.inputs['thread-count'] }}"

          if [[ "$IMPACT_AREA" != "none" ]]; then
            TAG_EXPRESSION="$(bash scripts/select-impact-tags.sh --area "$IMPACT_AREA")"
          else
            case "$SUITE" in
              all) TAG_EXPRESSION="" ;;
              p0-smoke) TAG_EXPRESSION="@p0 and @smoke" ;;
              p1-regression) TAG_EXPRESSION="@p1 and @regression" ;;
              api-contract) TAG_EXPRESSION="@api and @contract" ;;
              ui-critical) TAG_EXPRESSION="@ui and @critical" ;;
              nightly-stateful) TAG_EXPRESSION="@stateful and @regression" ;;
              accessibility) TAG_EXPRESSION="@accessibility" ;;
              docker-smoke) TAG_EXPRESSION="@docker-smoke or (@p0 and @smoke)" ;;
              *) TAG_EXPRESSION="@$SUITE" ;;
            esac
          fi

          if [[ "$PARALLEL" == "true" && "$SUITE" =~ ^(hybrid|stateful|nightly-stateful)$ ]]; then
            echo "::error::Suite '$SUITE' is stateful and must run with parallel=false. Parallel mode adds 'not @stateful', which would execute zero scenarios."
            exit 1
          fi

          MVN_ARGS=(-Dheadless=true -Dbrowser="$BROWSER" -Dsuite.name="$SUITE")

          if [[ "$PARALLEL" == "true" ]]; then
            if [[ -z "$TAG_EXPRESSION" ]]; then
              TAG_EXPRESSION="not @stateful"
            else
              TAG_EXPRESSION="($TAG_EXPRESSION) and not @stateful"
            fi
            MVN_ARGS+=(-Dsuite.xml.file=target/test-classes/suites/testng-parallel.xml -Dparallel=methods -Dthread.count="$THREAD_COUNT")
          else
            MVN_ARGS+=(-Dparallel=none)
          fi

          if [[ -n "$TAG_EXPRESSION" ]]; then
            MVN_ARGS+=("-Dcucumber.filter.tags=$TAG_EXPRESSION")
          fi

          {
            echo "REPORT_BROWSER=$BROWSER"
            echo "REPORT_SUITE=$SUITE"
            echo "REPORT_PARALLEL=$PARALLEL"
            echo "REPORT_THREAD_COUNT=$THREAD_COUNT"
            echo "REPORT_JOB_NAME=selected-$BROWSER-$SUITE"
            echo "REPORT_TAG_EXPRESSION=$TAG_EXPRESSION"
          } >> "$GITHUB_ENV"

          bash scripts/run-maven-with-infra-retry.sh mvn test "${MVN_ARGS[@]}"
          bash scripts/assert-scenarios-executed.sh
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/run-summary/github-step-summary.md ]]; then
            cat target/run-summary/github-step-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f target/run-summary/impact-selection.md ]]; then
            cat target/run-summary/impact-selection.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build Pages report bundle
        if: always()
        shell: bash
        run: bash scripts/build-pages-report.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eventhub-test-reports-selected-${{ github.event.inputs.browser }}-${{ github.event.inputs.suite }}-parallel-${{ github.event.inputs.parallel }}
          path: |
            target/cucumber-reports
            target/extent-report
            target/allure-results
            target/axe-reports
            target/visual-sanity
            target/visual-diff
            target/governance
            target/run-summary
            target/run-logs
            target/surefire-reports
            screenshots
      - name: Upload Pages report bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pages-report-selected-${{ github.event.inputs.browser }}-${{ github.event.inputs.suite }}-parallel-${{ github.event.inputs.parallel }}-threads-${{ github.event.inputs['thread-count'] }}
          path: target/pages-report

  publish-pages:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - impact-tests
      - matrix-tests
      - nightly-regression
      - selected-tests
    runs-on: ubuntu-latest
    name: publish / github-pages report
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore persistent report history
        shell: bash
        run: bash scripts/restore-pages-history.sh

      - name: Download Pages report bundles
        uses: actions/download-artifact@v5
        with:
          pattern: pages-report-*
          path: target/pages-site
          merge-multiple: true

      - name: Build Pages site index
        shell: bash
        run: bash scripts/build-pages-site.sh

      - name: Persist report history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/persist-pages-history.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload report site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/pages-site

      - name: Deploy report site to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

      - name: Add report links to workflow summary
        if: always()
        shell: bash
        run: |
          PAGE_URL="${{ steps.deploy-pages.outputs.page_url }}"
          RUN_REPORT_URL="${PAGE_URL}runs/${{ github.run_id }}-attempt-${{ github.run_attempt }}/"
          {
            echo "### EventHub GitHub Pages Report"
            echo
            echo "- This workflow run: [${RUN_REPORT_URL}](${RUN_REPORT_URL})"
            echo "- All reports dashboard: [${PAGE_URL}](${PAGE_URL})"
            echo "- Latest dashboard: [${PAGE_URL}latest/](${PAGE_URL}latest/)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f target/pages-site/pages-summary.md ]]; then
            sed "s#](runs/#](${PAGE_URL}runs/#g" target/pages-site/pages-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
