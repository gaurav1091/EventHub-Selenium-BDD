name: EventHub Selenium BDD

on:
  push:
  pull_request:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      browser:
        description: Browser for UI tests
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
      suite:
        description: Test suite/tag expression to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - ui
          - api
          - regression
          - admin
          - auth
          - bookings
          - events
          - navigation
          - hybrid
          - stateful
          - parallel-safe
          - all
      parallel:
        description: Run scenarios in parallel
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      thread-count:
        description: Thread count used when parallel=true
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
          - "5"

jobs:
  matrix-tests:
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            suite: smoke
            parallel: "false"
            thread-count: "2"
          - browser: firefox
            suite: smoke
            parallel: "false"
            thread-count: "2"
          - browser: chrome
            suite: api
            parallel: "true"
            thread-count: "2"
          - browser: chrome
            suite: parallel-safe
            parallel: "true"
            thread-count: "4"
    name: matrix / ${{ matrix.browser }} / ${{ matrix.suite }} / parallel=${{ matrix.parallel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        shell: bash
        run: |
          BROWSER="${{ matrix.browser }}"
          SUITE="${{ matrix.suite }}"
          PARALLEL="${{ matrix.parallel }}"
          THREAD_COUNT="${{ matrix['thread-count'] }}"

          if [[ "$SUITE" == "all" ]]; then
            TAG_EXPRESSION=""
          else
            TAG_EXPRESSION="@$SUITE"
          fi

          MVN_ARGS=(-Dheadless=true -Dbrowser="$BROWSER")

          if [[ "$PARALLEL" == "true" ]]; then
            if [[ -z "$TAG_EXPRESSION" ]]; then
              TAG_EXPRESSION="not @stateful"
            else
              TAG_EXPRESSION="($TAG_EXPRESSION) and not @stateful"
            fi
            MVN_ARGS+=(-Dsuite.xml.file=target/test-classes/suites/testng-parallel.xml -Dparallel=methods -Dthread.count="$THREAD_COUNT")
          else
            MVN_ARGS+=(-Dparallel=none)
          fi

          if [[ -n "$TAG_EXPRESSION" ]]; then
            MVN_ARGS+=("-Dcucumber.filter.tags=$TAG_EXPRESSION")
          fi

          bash scripts/run-maven-with-infra-retry.sh mvn test "${MVN_ARGS[@]}"
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/run-summary/github-step-summary.md ]]; then
            cat target/run-summary/github-step-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eventhub-test-reports-${{ matrix.browser }}-${{ matrix.suite }}-parallel-${{ matrix.parallel }}
          path: |
            target/cucumber-reports
            target/extent-report
            target/allure-results
            target/axe-reports
            target/governance
            target/run-summary
            target/run-logs
            target/surefire-reports
            screenshots

  nightly-regression:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            suite: regression
            tag-expression: "(@regression and @parallel-safe) and not @stateful"
            parallel: "true"
            thread-count: "4"
          - browser: firefox
            suite: regression
            tag-expression: "(@regression and @parallel-safe) and not @stateful"
            parallel: "true"
            thread-count: "4"
          - browser: chrome
            suite: api-regression
            tag-expression: "@api and @regression"
            parallel: "true"
            thread-count: "3"
          - browser: chrome
            suite: stateful-regression
            tag-expression: "@stateful"
            parallel: "false"
            thread-count: "1"
    name: nightly / ${{ matrix.browser }} / ${{ matrix.suite }} / parallel=${{ matrix.parallel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run nightly regression
        shell: bash
        run: |
          MVN_ARGS=(-Dheadless=true -Dbrowser="${{ matrix.browser }}" "-Dcucumber.filter.tags=${{ matrix['tag-expression'] }}")

          if [[ "${{ matrix.parallel }}" == "true" ]]; then
            MVN_ARGS+=(-Dsuite.xml.file=target/test-classes/suites/testng-parallel.xml -Dparallel=methods -Dthread.count="${{ matrix['thread-count'] }}")
          else
            MVN_ARGS+=(-Dparallel=none)
          fi

          bash scripts/run-maven-with-infra-retry.sh mvn test "${MVN_ARGS[@]}"
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/run-summary/github-step-summary.md ]]; then
            cat target/run-summary/github-step-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eventhub-nightly-reports-${{ matrix.browser }}-${{ matrix.suite }}-parallel-${{ matrix.parallel }}
          path: |
            target/cucumber-reports
            target/extent-report
            target/allure-results
            target/axe-reports
            target/governance
            target/run-summary
            target/run-logs
            target/surefire-reports
            screenshots

  selected-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: selected / ${{ github.event.inputs.browser }} / ${{ github.event.inputs.suite }} / parallel=${{ github.event.inputs.parallel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run selected tests
        shell: bash
        run: |
          BROWSER="${{ github.event.inputs.browser }}"
          SUITE="${{ github.event.inputs.suite }}"
          PARALLEL="${{ github.event.inputs.parallel }}"
          THREAD_COUNT="${{ github.event.inputs['thread-count'] }}"

          if [[ "$SUITE" == "all" ]]; then
            TAG_EXPRESSION=""
          else
            TAG_EXPRESSION="@$SUITE"
          fi

          MVN_ARGS=(-Dheadless=true -Dbrowser="$BROWSER")

          if [[ "$PARALLEL" == "true" ]]; then
            if [[ -z "$TAG_EXPRESSION" ]]; then
              TAG_EXPRESSION="not @stateful"
            else
              TAG_EXPRESSION="($TAG_EXPRESSION) and not @stateful"
            fi
            MVN_ARGS+=(-Dsuite.xml.file=target/test-classes/suites/testng-parallel.xml -Dparallel=methods -Dthread.count="$THREAD_COUNT")
          else
            MVN_ARGS+=(-Dparallel=none)
          fi

          if [[ -n "$TAG_EXPRESSION" ]]; then
            MVN_ARGS+=("-Dcucumber.filter.tags=$TAG_EXPRESSION")
          fi

          bash scripts/run-maven-with-infra-retry.sh mvn test "${MVN_ARGS[@]}"
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/run-summary/github-step-summary.md ]]; then
            cat target/run-summary/github-step-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eventhub-test-reports-selected-${{ github.event.inputs.browser }}-${{ github.event.inputs.suite }}-parallel-${{ github.event.inputs.parallel }}
          path: |
            target/cucumber-reports
            target/extent-report
            target/allure-results
            target/axe-reports
            target/governance
            target/run-summary
            target/run-logs
            target/surefire-reports
            screenshots
